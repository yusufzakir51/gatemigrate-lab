# Authored adapted development task; gm-phase3d approvals are lab policy.
# This does not reproduce or assert RevenueCat's historical external settings.
name: GateMigrate Phase4E RevenueCat workload
'on':
  workflow_dispatch: null
permissions:
  contents: read
env:
  GM_PLATFORM: github
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: gm-phase3d
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - run: python3 workload_bootstrap.py --operation revenuecat_emulator_tests
