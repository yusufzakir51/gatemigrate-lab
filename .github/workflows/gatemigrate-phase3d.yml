# GateMigrate Phase 3D prospective marker-only candidate.
# Install as .github/workflows/gatemigrate-phase3d.yml in the disposable lab repository.
name: GateMigrate Phase 3D
"on":
  workflow_dispatch:
permissions:
  contents: read
env:
  GM_PLATFORM: github
jobs:
  protected_work:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 native/probe.py marker --family deployment_authorization --label protected-context
      - run: python3 native/probe.py marker --family approval_enforcement --label protected-context
